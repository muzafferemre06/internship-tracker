services:
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      ALLOWED_ORIGIN: http://localhost:8081
      DATABASE_PATH: /app/data/internship-tracker.db
      MIGRATIONS_PATH: /app/migrations
      CANDIDATE_PROFILE_PATH: /app/configs/candidate-profile.json
      SOURCES_PATH: /app/configs/sources.json
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_THINKING_LEVEL: ${LLM_THINKING_LEVEL:-minimal}
      LLM_INPUT_COST_PER_MILLION_USD: ${LLM_INPUT_COST_PER_MILLION_USD:-0}
      LLM_OUTPUT_COST_PER_MILLION_USD: ${LLM_OUTPUT_COST_PER_MILLION_USD:-0}
      SCAN_SCHEDULE: ${SCAN_SCHEDULE:-0 9 * * 1}
      SCAN_TIMEZONE: ${SCAN_TIMEZONE:-Europe/Istanbul}
      BACKUP_ENABLED: "true"
      BACKUP_DIRECTORY: /app/backups
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Europe/Istanbul}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
    volumes:
      - tracker_data:/app/data
      - tracker_backups:/app/backups
      - ../configs/candidate-profile.json:/app/configs/candidate-profile.json:ro
      - ../configs/sources.json:/app/configs/sources.json:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--timeout=3", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--timeout=3", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  tracker_data:
  tracker_backups:
