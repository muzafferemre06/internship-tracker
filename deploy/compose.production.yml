name: internship-tracker

x-runtime-hardening: &runtime-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 45s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  api:
    <<: *runtime-hardening
    image: "${API_IMAGE:?API_IMAGE must be a repository@sha256 digest reference}"
    pull_policy: always
    init: true
    environment:
      APP_ENV: production
      HTTP_ADDR: ":8080"
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:?set the public HTTPS origin}"
      DATABASE_PATH: /app/data/internship-tracker.db
      MIGRATIONS_PATH: /app/migrations
      CANDIDATE_PROFILE_PATH: /app/configs/candidate-profile.json
      SOURCES_PATH: /app/configs/sources.json
      LLM_PROVIDER: "${LLM_PROVIDER:-deterministic}"
      LLM_MODEL: "${LLM_MODEL:-}"
      LLM_THINKING_LEVEL: "${LLM_THINKING_LEVEL:-minimal}"
      LLM_INPUT_COST_PER_MILLION_USD: "${LLM_INPUT_COST_PER_MILLION_USD:-0}"
      LLM_OUTPUT_COST_PER_MILLION_USD: "${LLM_OUTPUT_COST_PER_MILLION_USD:-0}"
      SCAN_SCHEDULE: "${SCAN_SCHEDULE:-0 9 * * 1}"
      SCAN_TIMEZONE: "${SCAN_TIMEZONE:-Europe/Istanbul}"
      BACKUP_ENABLED: "true"
      BACKUP_DIRECTORY: /app/backups
      BACKUP_TIME: "${BACKUP_TIME:-02:00}"
      BACKUP_TIMEZONE: "${BACKUP_TIMEZONE:-Europe/Istanbul}"
      BACKUP_RETENTION: "${BACKUP_RETENTION:-7}"
      WEB_PUSH_ENABLED: "true"
      WEB_PUSH_PUBLIC_KEY: "${WEB_PUSH_PUBLIC_KEY:?set the VAPID public key}"
      WEB_PUSH_PRIVATE_KEY_FILE: /run/secrets/web_push_private_key
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:?set the VAPID contact URI}"
      # The selected provider's path points at its read-only mounted secret.
      # Empty values are harmless for the deterministic provider.
      OPENROUTER_API_KEY_FILE: "${OPENROUTER_API_KEY_FILE:-}"
      GEMINI_API_KEY_FILE: "${GEMINI_API_KEY_FILE:-}"
    expose:
      - "8080"
    volumes:
      - type: volume
        source: tracker_data
        target: /app/data
      - type: volume
        source: tracker_backups
        target: /app/backups
      - type: bind
        source: "${CANDIDATE_PROFILE_FILE:?set the candidate profile host path}"
        target: /app/configs/candidate-profile.json
        read_only: true
      - type: bind
        source: "${SOURCES_FILE:?set the sources host path}"
        target: /app/configs/sources.json
        read_only: true
      - type: bind
        source: "${API_SECRETS_DIRECTORY:?set the API secrets host directory}"
        target: /run/secrets
        read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--timeout=3", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - application

  web:
    <<: *runtime-hardening
    image: "${WEB_IMAGE:?WEB_IMAGE must be a repository@sha256 digest reference}"
    pull_policy: always
    init: true
    user: "101:101"
    entrypoint:
      - /usr/sbin/nginx
    command:
      - -g
      - daemon off;
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./nginx.production.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--timeout=3", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - application
      - tunnel

  cloudflared:
    <<: *runtime-hardening
    image: "${CLOUDFLARED_IMAGE:?CLOUDFLARED_IMAGE must be a repository@sha256 digest reference}"
    pull_policy: always
    user: "${DEPLOY_UID:?set the non-root deployment UID}:${DEPLOY_GID:?set the non-root deployment GID}"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      web:
        condition: service_healthy
    secrets:
      - source: cloudflare_tunnel_token
        target: cloudflare_tunnel_token
        mode: 0444
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - tunnel

volumes:
  tracker_data:
  tracker_backups:

networks:
  application:
    internal: true
  tunnel:

secrets:
  cloudflare_tunnel_token:
    file: "${CLOUDFLARE_TUNNEL_TOKEN_FILE:?set the Cloudflare Tunnel token host path}"
